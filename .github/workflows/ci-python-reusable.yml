name: Python CI Reusable Workflow

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: Name of the service (e.g., analytics-service)
      service_path:
        required: true
        type: string
        description: Path to the service directory
      python_version:
        required: false
        type: string
        default: '3.11'
        description: Python version to use
      gitops_repository:
        required: false
        type: string
        default: andre-svager/hackathon-gitops
        description: GitOps repository to update with the published image
    secrets:
      aws_account_id:
        required: true
      aws_region:
        required: true
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      gitops_token:
        required: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.service_path }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ inputs.service_path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8 isort bandit[toml]

      - name: Lint with black (format check)
        working-directory: ${{ inputs.service_path }}
        run: black --check . || true

      - name: Lint with isort (import sort)
        working-directory: ${{ inputs.service_path }}
        run: isort --check-only . || true

      - name: Lint with flake8
        working-directory: ${{ inputs.service_path }}
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || false

      - name: Security linting with bandit
        working-directory: ${{ inputs.service_path }}
        run: bandit -r . -ll --exit-code=0 -f json -o bandit-report.json || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report-${{ inputs.service_name }}
          path: ${{ inputs.service_path }}/bandit-report.json

      - name: Run unit tests
        working-directory: ${{ inputs.service_path }}
        run: pytest -v --cov=. --cov-report=xml --cov-report=html || true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-${{ inputs.service_name }}
          path: ${{ inputs.service_path }}/htmlcov
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ inputs.service_path }}/coverage.xml
          flags: ${{ inputs.service_name }}
          name: ${{ inputs.service_name }}-coverage
          fail_ci_if_error: false
        continue-on-error: true

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy || true

      - name: SCA - Scan filesystem with Trivy
        working-directory: ${{ inputs.service_path }}
        run: trivy fs --severity CRITICAL,HIGH . || true

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ secrets.aws_region }}

      - name: Login to Amazon ECR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether image already exists
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: image-check
        env:
          ECR_REPOSITORY: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image tag $IMAGE_TAG already exists; skipping build and push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and scan Docker image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image-check.outputs.exists != 'true' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ${{ inputs.service_path }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t "$IMAGE_URI" .
          trivy image --severity CRITICAL,HIGH "$IMAGE_URI" || true

      - name: Push Docker image to ECR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image-check.outputs.exists != 'true' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Checkout GitOps repository
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.gitops_repository }}
          gitops_token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops
          ref: main

      - name: Update GitOps image values
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        working-directory: gitops
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_URL=$(aws ssm get-parameter \
            --name "/solidarytech/production/ecr/${SERVICE_NAME}-url" \
            --query Parameter.Value \
            --output text)
          VALUES_FILE="environments/production/${SERVICE_NAME}.yaml"
          sed -i -E "s|^  repository: .*|  repository: ${ECR_URL}|" "$VALUES_FILE"
          sed -i -E "s|^  tag: .*|  tag: ${IMAGE_TAG}|" "$VALUES_FILE"

      - name: Create GitOps pull request
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: gitops-pr
        uses: peter-evans/create-pull-request@v7
        with:
          path: gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          commit-message: "Update ${{ inputs.service_name }} image to ${{ github.sha }}"
          branch: "ci/${{ inputs.service_name }}-${{ github.sha }}"
          delete-branch: true
          title: "Deploy ${{ inputs.service_name }} ${{ github.sha }}"
          body: |
            Updates `${{ inputs.service_name }}` to image tag `${{ github.sha }}`.

            Source commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          add-paths: environments/production/${{ inputs.service_name }}.yaml

      - name: Publish GitOps PR link
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          echo "## GitOps deployment PR" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.gitops-pr.outputs.pull-request-url }}" ]; then
            echo "[Review GitOps PR](${{ steps.gitops-pr.outputs.pull-request-url }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No GitOps PR was created or updated." >> "$GITHUB_STEP_SUMMARY"
          fi